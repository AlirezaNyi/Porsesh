version: '3.9'
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: porsesh
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  web:
    build: .
    depends_on:
      - db
    ports:
      - '3000:3000'
    environment:
      POSTGRES_PRISMA_URL: postgres://postgres:postgres@db:5432/porsesh
      DATABASE_URL: postgres://postgres:postgres@db:5432/porsesh
      NODE_ENV: production
    command: sh -c "npx prisma migrate deploy && npm run start"

volumes:
  db-data:
