version: '3.9'

services:
  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-porsesh}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-porsesh}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Remove this port mapping if you don't need direct host access to Postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

  # ── Next.js application ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # Wait for Postgres to pass its healthcheck
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production

      # Database — Prisma reads POSTGRES_PRISMA_URL; DATABASE_URL is the fallback
      POSTGRES_PRISMA_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-porsesh}
      DATABASE_URL:        postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-porsesh}

      # Clerk authentication — Compose reads these from the .env file at project root.
      # docker compose up will fail immediately if either is unset, preventing silent failures.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
      CLERK_SECRET_KEY:                  ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY in .env}

volumes:
  db-data:
